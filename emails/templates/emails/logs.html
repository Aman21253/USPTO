<!DOCTYPE html>
<html>
<head>
    <title>Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-green-400">

<div class="max-w-6xl mx-auto mt-10">

    <h1 class="text-3xl font-bold mb-6 text-white">🧾 System Logs</h1>

    <div class="bg-black p-4 rounded-xl h-[500px] overflow-y-scroll text-sm font-mono">
        {% for line in logs %}
            <div>{{ line }}</div>
        {% endfor %}
    </div>

    <div class="mt-6">
        <a href="{% url 'dashboard' %}" 
           class="text-blue-400 hover:underline">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
